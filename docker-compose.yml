services:
  postgres:
    image: postgres:17
    container_name: produtos_postgres
    environment:
      POSTGRES_DB: produto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - produto_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

volumes:
  produto_pg_data: