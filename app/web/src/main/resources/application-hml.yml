spring:
  application:
    name: produto-web-hml
  r2dbc:
    url: ${PRODUTO_WEB_HML_URL}
    username: ${PRODUTO_WEB_HML_USERNAME}
    password: ${PRODUTO_WEB_HML_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 9091
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
  api-docs:
    path: /api-docs

anvisa:
  etl:
    base-url: ${ANVISA_ETL_BASE_URL}
    api-key: ${ANVISA_ETL_API_KEY}
