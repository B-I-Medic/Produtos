spring:
  application:
    name: produto-etl-dev
  jpa:
    open-in-view: false

server:
  port: ${ETL_SERVER_PORT:9093}

app:
  datasource:
    origem:
      ufx:
        driver-class-name: dbmaker.sql.type4.Driver
        url: ${DBMAKER_UFX_URL}
        username: ${DBMAKER_UFX_USERNAME}
        password: ${DBMAKER_UFX_PASSWORD}
      s00:
        driver-class-name: dbmaker.sql.type4.Driver
        url: ${DBMAKER_S00_URL}
        username: ${DBMAKER_S00_USERNAME}
        password: ${DBMAKER_S00_PASSWORD}
    produto:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5432/produto
      username: app-etl-dev
      password: etl123

etl:
  thread-pool-size: 4

anvisa:
  internal-api-key: ${ANVISA_ETL_API_KEY}
  worker:
    poll-interval-ms: ${ANVISA_WORKER_POLL_INTERVAL_MS:1000}
    initial-delay-ms: ${ANVISA_WORKER_INITIAL_DELAY_MS:1000}
    lease-seconds: ${ANVISA_WORKER_LEASE_SECONDS:1800}
  tls:
    trust-store: ${ANVISA_TRUSTSTORE_PATH}
    trust-store-password: ${ANVISA_TRUSTSTORE_PASSWORD}
    trust-store-type: ${ANVISA_TRUSTSTORE_TYPE:PKCS12}
