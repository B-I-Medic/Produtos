name: deploy-hml

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: homologacao
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            app/web/pom.xml
            app/etl/pom.xml

      - name: Resolve and validate module versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          web_version=$(mvn -q -pl app/web -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          etl_version=$(mvn -q -pl app/etl -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)

          if [[ "$web_version" != "$etl_version" ]]; then
            echo "As versões dos módulos divergem: Web=$web_version ETL=$etl_version" >&2
            exit 1
          fi

          echo "release_version=$web_version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=produto-release-$web_version" >> "$GITHUB_OUTPUT"

      - name: Install DbMaker driver
        shell: pwsh
        run: |
          mvn install:install-file `
            -Dfile="libs/driver-dbmaker.jar" `
            -DgroupId="com.dbmaker" `
            -DartifactId="driver-dbmaker" `
            -Dversion="1.0.0" `
            -Dpackaging="jar"

      - name: Run tests and package modules
        run: mvn -B clean verify

      - name: Prepare immutable release artifact
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/release
          cp app/web/target/Web.jar dist/release/Web.jar
          cp app/etl/target/Etl.jar dist/release/Etl.jar

          web_sha=$(sha256sum dist/release/Web.jar | awk '{print $1}')
          etl_sha=$(sha256sum dist/release/Etl.jar | awk '{print $1}')

          cat > dist/release/release-manifest.json <<EOF
          {
            "artifact_name": "$ARTIFACT_NAME",
            "version": "$RELEASE_VERSION",
            "commit_sha": "$GITHUB_SHA",
            "workflow": "$GITHUB_WORKFLOW",
            "run_id": "$GITHUB_RUN_ID",
            "artifacts": {
              "web": {
                "file": "Web.jar",
                "sha256": "$web_sha"
              },
              "etl": {
                "file": "Etl.jar",
                "sha256": "$etl_sha"
              }
            }
          }
          EOF

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: dist/release
          if-no-files-found: error
          retention-days: 90

  migrate:
    needs: build
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Flyway migrations
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.12.0 \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            validate

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.12.0 \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            migrate

  deploy:
    needs:
      - build
      - migrate
    runs-on: ubuntu-latest
    environment: homologacao
    env:
      DEPLOY_ROOT: C:/apps/produto/hml
      REMOTE_SCRIPT_PATH: C:/apps/produto/hml/deploy-windows.ps1
      WEB_SERVER_JAR: ${{ vars.WEB_SERVER_JAR }}
      ETL_SERVER_JAR: ${{ vars.ETL_SERVER_JAR }}
      WEB_SERVICE_NAME: ${{ vars.WEB_SERVICE_NAME }}
      ETL_SERVICE_NAME: ${{ vars.ETL_SERVICE_NAME }}
      WEB_HEALTH_URL: ${{ vars.HEALTHCHECK_URL }}
      ETL_HEALTH_URL: http://127.0.0.1:9093/actuator/health/readiness
      EXPECTED_WEB_PORT: 9091
      EXPECTED_ETL_PORT: 9093
      EXPECTED_PROFILE: hml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist/release

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Stage artifacts on Windows Server
        shell: bash
        run: |
          set -euo pipefail
          scp dist/release/Web.jar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${WEB_SERVER_JAR}.new"
          scp dist/release/Etl.jar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${ETL_SERVER_JAR}.new"

      - name: Upload deploy script
        shell: bash
        run: |
          set -euo pipefail
          scp .github/scripts/deploy-windows.ps1 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_SCRIPT_PATH}"

      - name: Deploy and restart services
        shell: bash
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "powershell -NoProfile -ExecutionPolicy Bypass -File '$REMOTE_SCRIPT_PATH' -WebServiceName '$WEB_SERVICE_NAME' -WebJarPath '$WEB_SERVER_JAR' -EtlServiceName '$ETL_SERVICE_NAME' -EtlJarPath '$ETL_SERVER_JAR' -WebHealthUrl '$WEB_HEALTH_URL' -EtlHealthUrl '$ETL_HEALTH_URL' -ExpectedProfile '$EXPECTED_PROFILE' -DeployRoot '$DEPLOY_ROOT' -ExpectedWebPort $EXPECTED_WEB_PORT -ExpectedEtlPort $EXPECTED_ETL_PORT"

      - name: Cleanup remote deploy script
        if: always()
        shell: bash
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "powershell -NoProfile -Command \"if (Test-Path -LiteralPath '$REMOTE_SCRIPT_PATH') { Remove-Item -LiteralPath '$REMOTE_SCRIPT_PATH' -Force }\""
