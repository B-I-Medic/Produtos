name: deploy-hml

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      web_artifact_name: ${{ steps.versions.outputs.web_artifact_name }}
      etl_artifact_name: ${{ steps.versions.outputs.etl_artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            app/web/pom.xml
            app/etl/pom.xml

      - name: Resolve artifact names
        id: versions
        run: |
          web_version=$(mvn -q -pl app/web -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          etl_version=$(mvn -q -pl app/etl -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)

          echo "web_artifact_name=produto-web-${web_version}" >> "$GITHUB_OUTPUT"
          echo "etl_artifact_name=produto-etl-${etl_version}" >> "$GITHUB_OUTPUT"

      - name: Install DbMaker driver
        shell: pwsh
        run: |
          mvn install:install-file `
            -Dfile="libs/driver-dbmaker.jar" `
            -DgroupId="com.dbmaker" `
            -DartifactId="driver-dbmaker" `
            -Dversion="1.0.0" `
            -Dpackaging="jar"

      - name: Package modules
        run: mvn -B -DskipTests package

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.web_artifact_name }}
          path: app/web/target/Web.jar
          if-no-files-found: error

      - name: Upload etl artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.etl_artifact_name }}
          path: app/etl/target/Etl.jar
          if-no-files-found: error

  migrate:
    needs: build
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.12.0 \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            migrate


  deploy:
    needs:
      - build
      - migrate
    runs-on: ubuntu-latest
    environment: homologacao

    env:
      WEB_SERVER_JAR: ${{ vars.WEB_SERVER_JAR }}
      ETL_SERVER_JAR: ${{ vars.ETL_SERVER_JAR }}
      WEB_SERVICE_NAME: ${{ vars.WEB_SERVICE_NAME }}
      ETL_SERVICE_NAME: ${{ vars.ETL_SERVICE_NAME }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.web_artifact_name }}
          path: dist/web

      - name: Download etl artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.etl_artifact_name }}
          path: dist/etl

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stage artifacts on Windows Server
        run: |
          scp  dist/web/Web.jar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH_WEB }}.new"
          scp  dist/etl/Etl.jar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH_ETL }}.new"