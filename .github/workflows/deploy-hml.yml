name: deploy-hml

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      web_artifact_name: ${{ steps.versions.outputs.web_artifact_name }}
      etl_artifact_name: ${{ steps.versions.outputs.etl_artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            app/web/pom.xml
            app/etl/pom.xml

      - name: Resolve artifact names
        id: versions
        run: |
          web_version=$(mvn -q -pl app/web -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          etl_version=$(mvn -q -pl app/etl -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)

          echo "web_artifact_name=produto-web-${web_version}" >> "$GITHUB_OUTPUT"
          echo "etl_artifact_name=produto-etl-${etl_version}" >> "$GITHUB_OUTPUT"

      - name: Install DbMaker driver
        shell: pwsh
        run: |
          mvn install:install-file `
            -Dfile="libs/driver-dbmaker.jar" `
            -DgroupId="com.dbmaker" `
            -DartifactId="driver-dbmaker" `
            -Dversion="1.0.0" `
            -Dpackaging="jar"

      - name: Package modules
        run: mvn -B -DskipTests package

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.web_artifact_name }}
          path: app/web/target/Web.jar
          if-no-files-found: error

      - name: Upload etl artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versions.outputs.etl_artifact_name }}
          path: app/etl/target/Etl.jar
          if-no-files-found: error

  migrate:
    needs: build
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Flyway migrations
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.12.0 \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            migrate


  deploy:
    needs:
      - build
      - migrate
    runs-on: ubuntu-latest
    environment: homologacao

    env:
      WEB_SERVER_JAR: ${{ vars.WEB_SERVER_JAR }}
      ETL_SERVER_JAR: ${{ vars.ETL_SERVER_JAR }}
      WEB_SERVICE_NAME: ${{ vars.WEB_SERVICE_NAME }}
      ETL_SERVICE_NAME: ${{ vars.ETL_SERVICE_NAME }}
      HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}

    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.web_artifact_name }}
          path: dist/web

      - name: Download etl artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.etl_artifact_name }}
          path: dist/etl

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stage artifacts on Windows Server
        run: |
          scp  dist/web/Web.jar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH_WEB }}.new"
          scp  dist/etl/Etl.jar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH_ETL }}.new"

      - name: Upload deploy script
        run: |
          cat <<'EOF' > deploy.ps1
          param(
            [string]$WebServiceName,
            [string]$WebJarPath,
            [string]$EtlServiceName,
            [string]$EtlJarPath,
            [string]$HealthUrl,
            [string]$ExpectedProfile
          )

          $ErrorActionPreference = 'Stop'

          function Get-NssmValue {
            param(
              [string]$Name,
              [string]$Key
            )

            $value = & nssm get $Name $Key 2>$null
            if ($LASTEXITCODE -ne 0) {
              throw "Nao foi possivel ler '$Key' do servico '$Name' via nssm."
            }

            return ($value | Out-String).Trim()
          }

          function Get-ServiceEnvironment {
            param([string]$Name)

            $environment = @{}
            $raw = Get-NssmValue -Name $Name -Key 'AppEnvironmentExtra'
            foreach ($line in ($raw -split "`r?`n")) {
              if ($line -match '^(?<key>[^=]+)=(?<value>.*)$') {
                $environment[$matches['key'].Trim()] = $matches['value']
              }
            }

            return $environment
          }

          function Get-EffectiveEnvValue {
            param(
              [string]$Name,
              [hashtable]$ServiceEnvironment
            )

            if ($ServiceEnvironment.ContainsKey($Name) -and -not [string]::IsNullOrWhiteSpace($ServiceEnvironment[$Name])) {
              return $ServiceEnvironment[$Name]
            }

            $machineValue = [Environment]::GetEnvironmentVariable($Name, 'Machine')
            if (-not [string]::IsNullOrWhiteSpace($machineValue)) {
              return $machineValue
            }

            $userValue = [Environment]::GetEnvironmentVariable($Name, 'User')
            if (-not [string]::IsNullOrWhiteSpace($userValue)) {
              return $userValue
            }

            return $null
          }

          function Show-LogTail {
            param(
              [string]$Label,
              [string]$Path
            )

            if ([string]::IsNullOrWhiteSpace($Path) -or $Path -eq 'NUL') {
              return
            }

            if (Test-Path -LiteralPath $Path) {
              Write-Host "===== $Label ($Path) ====="
              Get-Content -LiteralPath $Path -Tail 50
            }
          }

          function Stop-ServiceIfRunning {
            param([string]$Name)

            try {
              $status = (& nssm status $Name | Out-String).Trim()
              if ($status -match 'SERVICE_RUNNING|START_PENDING') {
                & nssm stop $Name | Out-Host
                Start-Sleep -Seconds 5
              }
            } catch {
              Write-Host "Falha ao consultar/parar o servico '$Name': $($_.Exception.Message)"
              throw
            }
          }

          function Start-ServiceAndValidateProfile {
            param(
              [string]$Name,
              [string]$JarPath,
              [string]$ExpectedProfile
            )

            $application = Get-NssmValue -Name $Name -Key 'Application'
            $appParameters = Get-NssmValue -Name $Name -Key 'AppParameters'
            $stdoutPath = Get-NssmValue -Name $Name -Key 'AppStdout'
            $stderrPath = Get-NssmValue -Name $Name -Key 'AppStderr'
            $serviceEnvironment = Get-ServiceEnvironment -Name $Name

            $referencesExpectedJar =
              $application -eq $JarPath -or
              $appParameters -like "*$JarPath*" -or
              $appParameters -like "*$(Split-Path -Leaf $JarPath)*"

            if (-not $referencesExpectedJar) {
              throw "O servico '$Name' nao aponta para o jar esperado. Application='$application' AppParameters='$appParameters' JarEsperado='$JarPath'"
            }

            $configuredProfile = Get-EffectiveEnvValue -Name 'SPRING_PROFILES_ACTIVE' -ServiceEnvironment $serviceEnvironment
            $profileInParameters =
              $appParameters -like "*--spring.profiles.active=$ExpectedProfile*" -or
              $appParameters -like "*-Dspring.profiles.active=$ExpectedProfile*"

            if (($configuredProfile -ne $ExpectedProfile) -and (-not $profileInParameters)) {
              throw "O servico '$Name' nao esta configurado para o profile esperado '$ExpectedProfile'."
            }

            & nssm start $Name | Out-Host

            return @{
              Stdout = $stdoutPath
              Stderr = $stderrPath
            }
          }
          
          if (-not (Get-Command nssm -ErrorAction SilentlyContinue)) {
            throw 'nssm nao esta disponivel no PATH do servidor.'
          }

          $webStagedJarPath = "$WebJarPath.new"
          $etlStagedJarPath = "$EtlJarPath.new"

          if (-not (Test-Path -LiteralPath $webStagedJarPath)) {
            throw "Artifact do web nao encontrado em '$webStagedJarPath'."
          }

          if (-not (Test-Path -LiteralPath $etlStagedJarPath)) {
            throw "Artifact do etl nao encontrado em '$etlStagedJarPath'."
          }
          
          EOF
          
          scp  deploy.ps1 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:C:/apps/produto/hml/deploy.ps1"