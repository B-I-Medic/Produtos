name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            app/web/pom.xml
            app/etl/pom.xml

      - name: Install DbMaker driver
        shell: pwsh
        run: |
          mvn install:install-file `
            -Dfile="libs/driver-dbmaker.jar" `
            -DgroupId="com.dbmaker" `
            -DartifactId="driver-dbmaker" `
            -Dversion="1.0.0" `
            -Dpackaging="jar"

      - name: Run tests and build
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: mvn -B clean verify
