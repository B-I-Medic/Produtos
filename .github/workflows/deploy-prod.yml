name: deploy-prod

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: read

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.release.outputs.release_version }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      hml_run_id: ${{ steps.release.outputs.hml_run_id }}

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            app/web/pom.xml
            app/etl/pom.xml

      - name: Resolve release and homologation run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_version="${RELEASE_TAG#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag invalida: '$RELEASE_TAG'. Use vX.Y.Z." >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "A tag '$RELEASE_TAG' nao aponta para um commit presente em main." >&2
            exit 1
          fi

          web_version=$(mvn -q -pl app/web -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)
          etl_version=$(mvn -q -pl app/etl -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)

          if [[ "$web_version" != "$release_version" || "$etl_version" != "$release_version" ]]; then
            echo "A tag '$RELEASE_TAG' nao corresponde aos POMs: Web=$web_version ETL=$etl_version." >&2
            exit 1
          fi

          hml_run_id=$(gh run list \
            --workflow deploy-hml.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 20 \
            --json databaseId,headSha \
            --jq "map(select(.headSha == \"$GITHUB_SHA\")) | .[0].databaseId")

          if [[ -z "$hml_run_id" || "$hml_run_id" == "null" ]]; then
            echo "Nenhuma execucao HML bem-sucedida foi encontrada para o SHA $GITHUB_SHA." >&2
            exit 1
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=produto-release-$release_version" >> "$GITHUB_OUTPUT"
          echo "hml_run_id=$hml_run_id" >> "$GITHUB_OUTPUT"

  promote:
    needs: resolve
    runs-on: ubuntu-latest
    environment: producao
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      REMOTE_SCRIPT_PATH: ${{ vars.DEPLOY_ROOT }}/deploy-windows.ps1
      WEB_SERVER_JAR: ${{ vars.WEB_SERVER_JAR }}
      ETL_SERVER_JAR: ${{ vars.ETL_SERVER_JAR }}
      WEB_SERVICE_NAME: ${{ vars.WEB_SERVICE_NAME }}
      ETL_SERVICE_NAME: ${{ vars.ETL_SERVICE_NAME }}
      WEB_HEALTH_URL: http://127.0.0.1:9092/actuator/health/readiness
      ETL_HEALTH_URL: http://127.0.0.1:9094/actuator/health/readiness
      # O ETL desta release nao expoe HTTP; reativar http junto do servidor web do modulo.
      ETL_HEALTH_MODE: process
      EXPECTED_WEB_PORT: 9092
      EXPECTED_ETL_PORT: 9094
      EXPECTED_PROFILE: prod

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Download artifact from homologation run
        env:
          GH_TOKEN: ${{ github.token }}
          HML_RUN_ID: ${{ needs.resolve.outputs.hml_run_id }}
          ARTIFACT_NAME: ${{ needs.resolve.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cd dist/release
          gh run download "$HML_RUN_ID" --name "$ARTIFACT_NAME"

      - name: Verify immutable artifact manifest
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          manifest=dist/release/release-manifest.json
          test -f "$manifest"
          test -f dist/release/Web.jar
          test -f dist/release/Etl.jar

          manifest_sha=$(jq -r '.commit_sha' "$manifest")
          manifest_version=$(jq -r '.version' "$manifest")
          expected_web_sha=$(jq -r '.artifacts.web.sha256' "$manifest")
          expected_etl_sha=$(jq -r '.artifacts.etl.sha256' "$manifest")
          actual_web_sha=$(sha256sum dist/release/Web.jar | awk '{print $1}')
          actual_etl_sha=$(sha256sum dist/release/Etl.jar | awk '{print $1}')

          [[ "$manifest_sha" == "$GITHUB_SHA" ]]
          [[ "$manifest_version" == "$RELEASE_VERSION" ]]
          [[ "$expected_web_sha" == "$actual_web_sha" ]]
          [[ "$expected_etl_sha" == "$actual_etl_sha" ]]

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DEPLOY_ROOT
            WEB_SERVER_JAR
            ETL_SERVER_JAR
            WEB_SERVICE_NAME
            ETL_SERVICE_NAME
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "A variavel de producao '$name' nao esta configurada." >&2
              exit 1
            fi
          done

      - name: Validate migration history and run Flyway on production database
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.12.0 \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            info

          docker run --rm \
            -v "${{ github.workspace }}/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.12.0 \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            -ignoreMigrationPatterns="*:pending" \
            validate

          docker run --rm \
            -v "${{ github.workspace }}/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.12.0 \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            migrate

          docker run --rm \
            -v "${{ github.workspace }}/database/migrations:/flyway/sql:ro" \
            flyway/flyway:11.12.0 \
            -url="${{ secrets.FLYWAY_URL }}" \
            -user="${{ secrets.FLYWAY_USER }}" \
            -password="${{ secrets.FLYWAY_PASSWORD }}" \
            validate

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Stage artifacts on production Windows Server
        shell: bash
        run: |
          set -euo pipefail
          scp dist/release/Web.jar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${WEB_SERVER_JAR}.new"
          scp dist/release/Etl.jar "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${ETL_SERVER_JAR}.new"

      - name: Upload deploy script
        shell: bash
        run: |
          set -euo pipefail
          scp .github/scripts/deploy-windows.ps1 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_SCRIPT_PATH}"

      - name: Deploy and restart production services
        shell: bash
        run: |
          set -euo pipefail
          if ! deploy_output=$(ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \"$REMOTE_SCRIPT_PATH\" -WebServiceName \"$WEB_SERVICE_NAME\" -WebJarPath \"$WEB_SERVER_JAR\" -EtlServiceName \"$ETL_SERVICE_NAME\" -EtlJarPath \"$ETL_SERVER_JAR\" -WebHealthUrl \"$WEB_HEALTH_URL\" -EtlHealthUrl \"$ETL_HEALTH_URL\" -EtlHealthMode \"$ETL_HEALTH_MODE\" -ExpectedProfile \"$EXPECTED_PROFILE\" -DeployRoot \"$DEPLOY_ROOT\" -ExpectedWebPort \"$EXPECTED_WEB_PORT\" -ExpectedEtlPort \"$EXPECTED_ETL_PORT\"" 2>&1); then
            printf '%s\n' "$deploy_output"
            echo "A execucao remota do deploy falhou." >&2
            exit 1
          fi

          printf '%s\n' "$deploy_output"
          if [[ "$deploy_output" != *"DEPLOY_RESULT=SUCCESS"* ]]; then
            echo "O deploy remoto terminou sem confirmar DEPLOY_RESULT=SUCCESS." >&2
            exit 1
          fi

      - name: Cleanup remote deploy script
        if: always()
        shell: bash
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "powershell -NoProfile -Command \"if (Test-Path -LiteralPath '$REMOTE_SCRIPT_PATH') { Remove-Item -LiteralPath '$REMOTE_SCRIPT_PATH' -Force }\""
