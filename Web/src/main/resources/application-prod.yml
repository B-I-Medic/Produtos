spring:
  application:
    name: Web API
  r2dbc:
    url: ${PRODUTO_SPRING_R2DBC_URL}
    username: ${PRODUTO_SPRING_R2DBC_USERNAME}
    password: ${PRODUTO_SPRING_R2DBC_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 9091
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
