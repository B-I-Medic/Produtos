name: build-deploy

on:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build package
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Produtos
          path: target/Produto.jar

  deploy-prod:
    needs: ci
    runs-on: ubuntu-latest
    environment: production

    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
      SSH_PATH: ${{ secrets.SSH_PATH }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SERVICE_NAME: ProdutoApp
      APP_JAR_NAME: Produto.jar
      HEALTH_URL: http://localhost:9091/actuator/health

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Produtos
          path: dist/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload deploy assets
        run: |
          scp dist/${APP_JAR_NAME} "${SSH_USER}@${SSH_HOST}:${SSH_PATH}/${APP_JAR_NAME}.new"

      - name: Validate runtime and deploy
        run: |
          cat <<'EOF' > deploy.ps1
          param(
            [string]$ServiceName,
            [string]$DeployDir,
            [string]$JarName,
            [string]$HealthUrl
          )

          $ErrorActionPreference = 'Stop'

          function Get-NssmValue {
            param(
              [string]$Name,
              [string]$Key
            )

            $value = & nssm get $Name $Key 2>$null
            if ($LASTEXITCODE -ne 0) {
              throw "Nao foi possivel ler '$Key' do servico '$Name' via nssm."
            }

            return ($value | Out-String).Trim()
          }

          function Get-ServiceEnvironment {
            param([string]$Name)

            $environment = @{}
            $raw = Get-NssmValue -Name $Name -Key 'AppEnvironmentExtra'
            foreach ($line in ($raw -split "`r?`n")) {
              if ($line -match '^(?<key>[^=]+)=(?<value>.*)$') {
                $environment[$matches['key'].Trim()] = $matches['value']
              }
            }

            return $environment
          }

          function Get-EffectiveEnvValue {
            param(
              [string]$Name,
              [hashtable]$ServiceEnvironment
            )

            if ($ServiceEnvironment.ContainsKey($Name) -and -not [string]::IsNullOrWhiteSpace($ServiceEnvironment[$Name])) {
              return $ServiceEnvironment[$Name]
            }

            $machineValue = [Environment]::GetEnvironmentVariable($Name, 'Machine')
            if (-not [string]::IsNullOrWhiteSpace($machineValue)) {
              return $machineValue
            }

            $userValue = [Environment]::GetEnvironmentVariable($Name, 'User')
            if (-not [string]::IsNullOrWhiteSpace($userValue)) {
              return $userValue
            }

            return $null
          }

          function Show-LogTail {
            param(
              [string]$Label,
              [string]$Path
            )

            if ([string]::IsNullOrWhiteSpace($Path) -or $Path -eq 'NUL') {
              return
            }

            if (Test-Path -LiteralPath $Path) {
              Write-Host "===== $Label ($Path) ====="
              Get-Content -LiteralPath $Path -Tail 50
            }
          }

          $requiredVariables = @(
            'PRODUTO_SPRING_R2DBC_URL',
            'PRODUTO_SPRING_R2DBC_USERNAME',
            'PRODUTO_SPRING_R2DBC_PASSWORD',
            'PRODUTO_FLYWAY_DATASOURCE_URL',
            'PRODUTO_FLYWAY_DATASOURCE_USER',
            'PRODUTO_FLYWAY_DATASOURCE_PASSWORD',
            'JWT_SECRET',
            'SMTP_USERNAME',
            'SMTP_PASSWORD',
            'PRODUTO_SENHA_PADRAO'
          )

          $deployJarPath = Join-Path $DeployDir $JarName
          $stagedJarPath = "${deployJarPath}.new"

          if (-not (Get-Command nssm -ErrorAction SilentlyContinue)) {
            throw 'nssm nao esta disponivel no PATH do servidor.'
          }

          $appParameters = Get-NssmValue -Name $ServiceName -Key 'AppParameters'
          $application = Get-NssmValue -Name $ServiceName -Key 'Application'
          $stdoutPath = Get-NssmValue -Name $ServiceName -Key 'AppStdout'
          $stderrPath = Get-NssmValue -Name $ServiceName -Key 'AppStderr'
          $serviceEnvironment = Get-ServiceEnvironment -Name $ServiceName

          $referencesExpectedJar =
            $application -eq $deployJarPath -or
            $appParameters -like "*$deployJarPath*" -or
            $appParameters -like "*$JarName*"

          if (-not $referencesExpectedJar) {
            throw "O servico '$ServiceName' nao aponta para o jar esperado. Application='$application' AppParameters='$appParameters' JarEsperado='$deployJarPath'"
          }

          $missingVariables = @()
          foreach ($variableName in $requiredVariables) {
            $value = Get-EffectiveEnvValue -Name $variableName -ServiceEnvironment $serviceEnvironment
            if ([string]::IsNullOrWhiteSpace($value)) {
              $missingVariables += $variableName
            }
          }

          if ($missingVariables.Count -gt 0) {
            throw "Variaveis obrigatorias ausentes no servidor: $($missingVariables -join ', ')"
          }

          if (-not (Test-Path -LiteralPath $stagedJarPath)) {
            throw "Artifact enviado nao encontrado em '$stagedJarPath'."
          }

          & nssm stop $ServiceName | Out-Host
          Start-Sleep -Seconds 5

          Copy-Item -LiteralPath $stagedJarPath -Destination $deployJarPath -Force
          Remove-Item -LiteralPath $stagedJarPath -Force

          & nssm start $ServiceName | Out-Host

          $healthy = $false
          for ($attempt = 1; $attempt -le 40; $attempt++) {

            try {
              $response = Invoke-WebRequest -Uri $HealthUrl -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"UP"') {
                $healthy = $true
                break
              }
            } catch {
              Write-Host "Health check tentativa $attempt/18 falhou: $($_.Exception.Message)"
            }
          
            Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
            try {
              $status = & nssm status $ServiceName
              Write-Host "Status do servico: $status"
            } catch {
              Write-Host "Nao foi possivel obter o status do servico: $($_.Exception.Message)"
            }

            Show-LogTail -Label 'STDOUT' -Path $stdoutPath
            Show-LogTail -Label 'STDERR' -Path $stderrPath
            throw "Aplicacao nao ficou saudavel em '$HealthUrl' apos o deploy."
          }

          Write-Host 'Deploy concluido com health check valido.'
          EOF

          scp deploy.ps1 "${SSH_USER}@${SSH_HOST}:${SSH_PATH}/deploy.ps1"
          ssh "${SSH_USER}@${SSH_HOST}" "powershell -NoProfile -ExecutionPolicy Bypass -File \"${SSH_PATH}/deploy.ps1\" -ServiceName \"${SERVICE_NAME}\" -DeployDir \"${SSH_PATH}\" -JarName \"${APP_JAR_NAME}\" -HealthUrl \"${HEALTH_URL}\""

      - name: Cleanup remote deploy script
        if: always()
        run: |
          ssh "${SSH_USER}@${SSH_HOST}" "powershell -NoProfile -Command \"if (Test-Path -LiteralPath '${SSH_PATH}/deploy.ps1') { Remove-Item -LiteralPath '${SSH_PATH}/deploy.ps1' -Force }\""
