- name: Upload deploy script
  run: |
    cat <<'EOF' > deploy.ps1
    param(
      [string]$WebServiceName,
      [string]$WebJarPath,
      [string]$EtlServiceName,
      [string]$EtlJarPath,
      [string]$HealthUrl,
      [string]$ExpectedProfile
    )
    
    $ErrorActionPreference = 'Stop'
    
    function Get-NssmValue {
      param(
        [string]$Name,
        [string]$Key
      )
    
      $value = & nssm get $Name $Key 2>$null
      if ($LASTEXITCODE -ne 0) {
        throw "Nao foi possivel ler '$Key' do servico '$Name' via nssm."
      }
    
      return ($value | Out-String).Trim()
    }
    
    function Get-ServiceEnvironment {
      param([string]$Name)
    
      $environment = @{}
      $raw = Get-NssmValue -Name $Name -Key 'AppEnvironmentExtra'
      foreach ($line in ($raw -split "`r?`n")) {
        if ($line -match '^(?<key>[^=]+)=(?<value>.*)$') {
          $environment[$matches['key'].Trim()] = $matches['value']
        }
      }
    
      return $environment
    }
    
    function Get-EffectiveEnvValue {
      param(
        [string]$Name,
        [hashtable]$ServiceEnvironment
      )
    
      if ($ServiceEnvironment.ContainsKey($Name) -and -not [string]::IsNullOrWhiteSpace($ServiceEnvironment[$Name])) {
        return $ServiceEnvironment[$Name]
      }
    
      $machineValue = [Environment]::GetEnvironmentVariable($Name, 'Machine')
      if (-not [string]::IsNullOrWhiteSpace($machineValue)) {
        return $machineValue
      }
    
      $userValue = [Environment]::GetEnvironmentVariable($Name, 'User')
      if (-not [string]::IsNullOrWhiteSpace($userValue)) {
        return $userValue
      }
    
      return $null
    }
    
    function Show-LogTail {
      param(
        [string]$Label,
        [string]$Path
      )
    
      if ([string]::IsNullOrWhiteSpace($Path) -or $Path -eq 'NUL') {
        return
      }
    
      if (Test-Path -LiteralPath $Path) {
        Write-Host "===== $Label ($Path) ====="
        Get-Content -LiteralPath $Path -Tail 50
      }
    }
    
    function Stop-ServiceIfRunning {
      param([string]$Name)
    
      try {
        $status = (& nssm status $Name | Out-String).Trim()
        if ($status -match 'SERVICE_RUNNING|START_PENDING') {
          & nssm stop $Name | Out-Host
          Start-Sleep -Seconds 5
        }
      } catch {
        Write-Host "Falha ao consultar/parar o servico '$Name': $($_.Exception.Message)"
        throw
      }
    }
    
    function Start-ServiceAndValidateProfile {
      param(
        [string]$Name,
        [string]$JarPath,
        [string]$ExpectedProfile
      )
    
      $application = Get-NssmValue -Name $Name -Key 'Application'
      $appParameters = Get-NssmValue -Name $Name -Key 'AppParameters'
      $stdoutPath = Get-NssmValue -Name $Name -Key 'AppStdout'
      $stderrPath = Get-NssmValue -Name $Name -Key 'AppStderr'
      $serviceEnvironment = Get-ServiceEnvironment -Name $Name
    
      $referencesExpectedJar =
        $application -eq $JarPath -or
        $appParameters -like "*$JarPath*" -or
        $appParameters -like "*$(Split-Path -Leaf $JarPath)*"
    
      if (-not $referencesExpectedJar) {
        throw "O servico '$Name' nao aponta para o jar esperado. Application='$application' AppParameters='$appParameters' JarEsperado='$JarPath'"
      }
    
      $configuredProfile = Get-EffectiveEnvValue -Name 'SPRING_PROFILES_ACTIVE' -ServiceEnvironment $serviceEnvironment
      $profileInParameters =
        $appParameters -like "*--spring.profiles.active=$ExpectedProfile*" -or
        $appParameters -like "*-Dspring.profiles.active=$ExpectedProfile*"
    
      if (($configuredProfile -ne $ExpectedProfile) -and (-not $profileInParameters)) {
        throw "O servico '$Name' nao esta configurado para o profile esperado '$ExpectedProfile'."
      }
    
      & nssm start $Name | Out-Host
    
      return @{
        Stdout = $stdoutPath
        Stderr = $stderrPath
      }
    }
    
    if (-not (Get-Command nssm -ErrorAction SilentlyContinue)) {
      throw 'nssm nao esta disponivel no PATH do servidor.'
    }
    
    $webStagedJarPath = "$WebJarPath.new"
    $etlStagedJarPath = "$EtlJarPath.new"
    
    if (-not (Test-Path -LiteralPath $webStagedJarPath)) {
      throw "Artifact do web nao encontrado em '$webStagedJarPath'."
    }
    
    if (-not (Test-Path -LiteralPath $etlStagedJarPath)) {
      throw "Artifact do etl nao encontrado em '$etlStagedJarPath'."
    }
    
    Stop-ServiceIfRunning -Name $WebServiceName
    Stop-ServiceIfRunning -Name $EtlServiceName
    
    Copy-Item -LiteralPath $webStagedJarPath -Destination $WebJarPath -Force
    Remove-Item -LiteralPath $webStagedJarPath -Force
    
    Copy-Item -LiteralPath $etlStagedJarPath -Destination $EtlJarPath -Force
    Remove-Item -LiteralPath $etlStagedJarPath -Force
    
    $webLogs = Start-ServiceAndValidateProfile -Name $WebServiceName -JarPath $WebJarPath -ExpectedProfile $ExpectedProfile
    $etlLogs = Start-ServiceAndValidateProfile -Name $EtlServiceName -JarPath $EtlJarPath -ExpectedProfile $ExpectedProfile
    
    $healthy = $false
    for ($attempt = 1; $attempt -le 36; $attempt++) {
      try {
        $response = Invoke-WebRequest -Uri $HealthUrl -UseBasicParsing -TimeoutSec 10
        if ($response.StatusCode -eq 200 -and $response.Content -match '"status"\s*:\s*"UP"') {
          $healthy = $true
          break
        }
      } catch {
        Write-Host "Health check tentativa $attempt/36 falhou: $($_.Exception.Message)"
      }
    
      Start-Sleep -Seconds 30
    }
    
    if (-not $healthy) {
      try {
        Write-Host "Status web: $(& nssm status $WebServiceName)"
        Write-Host "Status etl: $(& nssm status $EtlServiceName)"
      } catch {
        Write-Host "Nao foi possivel obter o status dos servicos: $($_.Exception.Message)"
      }
    
      Show-LogTail -Label 'WEB STDOUT' -Path $webLogs.Stdout
      Show-LogTail -Label 'WEB STDERR' -Path $webLogs.Stderr
      Show-LogTail -Label 'ETL STDOUT' -Path $etlLogs.Stdout
      Show-LogTail -Label 'ETL STDERR' -Path $etlLogs.Stderr
      throw "Aplicacao web nao ficou saudavel em '$HealthUrl' apos o deploy."
    }
    
    Write-Host 'Deploy concluido com health check valido.'
    EOF
    
    scp  deploy.ps1 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:C:/apps/produto/hml/deploy.ps1"

- name: Deploy and restart services
  run: |
    ssh  "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
      "powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:/apps/produto/hml/deploy.ps1 -WebServiceName ${{ env.WEB_SERVICE_NAME }} -WebJarPath ${{ env.WEB_SERVER_JAR }} -EtlServiceName ${{ env.ETL_SERVICE_NAME }} -EtlJarPath ${{ env.ETL_SERVER_JAR }} -HealthUrl ${{ env.HEALTHCHECK_URL }} -ExpectedProfile hml"

- name: Cleanup remote deploy script
  if: always()
  run: |
    ssh  "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
      "powershell -NoProfile -Command \"if (Test-Path -LiteralPath 'C:/apps/produto/hml/deploy.ps1') { Remove-Item -LiteralPath 'C:/apps/produto/hml/deploy.ps1' -Force }\""
